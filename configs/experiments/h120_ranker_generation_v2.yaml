  confirmation_seeds: [238, 239, 240, 241, 242]
  outer_result_access_for_selection: false
evaluation_contract:
  ranking_column: rank_score
  daily_top_k: 10
  primary_metric: precision_at_10
  secondary_metrics: [map_at_10, ndcg_at_10, lift]
  uncertainty_unit: date
  paired_bootstrap_samples: 2000
  promotion_gate:
    lower_95_ci_delta_precision_at_10: strictly_greater_than_zero
    worst_fold_lift: at_least_one
    calibration: separate_non_ranking_gate
future_holdout_registration: experiments/h120_improvement/E10_future_holdout/registration.json
trade_authorized: false
