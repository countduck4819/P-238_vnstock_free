# Derived deterministically from R3 trial 14.  It remains research-only until
# its Phase-C review record is explicitly frozen; it is not a Phase-E approval.
model_version: h120_ranker_generation_v2_r3_trial14_candidate
random_seed: 238
n_jobs: -1
feature_group_version: h120_feature_groups_v1
feature_group: stock_primitives
ranking_contract:
  ranking_output: rank_score
  probability_output: p_h120_calibrated
  ranking_policy: rank_score_only
  probability_policy: causal_platt_after_rank_score
ranker:
  objective: rank:pairwise
  eval_metric: [map@10, ndcg@10]
  tree_method: hist
  n_estimators: 2000
  learning_rate: 0.04224854046417745
  max_depth: 3
  min_child_weight: 13.109618164996958
  subsample: 0.8789880623894869
  colsample_bytree: 0.6106978324634057
  gamma: 0.376522791916116
  reg_alpha: 0.08813054502646617
  reg_lambda: 14.016089740665802
  max_bin: 256
  early_stopping_rounds: 100
