model_version: h120_ranker_stock_primitives_v1
random_seed: 238
n_jobs: -1
feature_group_version: h120_feature_groups_v1
feature_group: stock_primitives
ranking_contract:
  ranking_output: rank_score
  probability_output: p_h120_calibrated
  ranking_policy: rank_score_only
  probability_policy: causal_platt_after_rank_score
ranker:
  objective: rank:pairwise
  eval_metric: [map@10, ndcg@10]
  tree_method: hist
  n_estimators: 2000
  learning_rate: 0.03
  max_depth: 4
  min_child_weight: 20.0
  subsample: 0.8
  colsample_bytree: 0.8
  gamma: 0.0
  reg_alpha: 0.1
  reg_lambda: 5.0
  max_bin: 256
  early_stopping_rounds: 100
