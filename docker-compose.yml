services:
    db:
        container_name: fireant_db
        image: postgres:16
        environment:
            - POSTGRES_USER=countduck
            - POSTGRES_PASSWORD=countduck
            - POSTGRES_DB=fireant_stock
        ports:
            - "5000:5432"
        volumes:
            - ./db:/var/lib/postgresql/data

    api:
        container_name: fireant_api
        image: node:22.9.0
        working_dir: /app/api
        volumes:
            - ./api:/app/api
            # Keep Linux-native packages out of the Windows bind mount.
            - fireant_api_node_modules:/app/api/node_modules
            - ./data:/app/data
            - ./runs:/app/runs:ro
            - ./deploy/price_forecast_lstm:/app/deploy/price_forecast_lstm:ro
            - ./predict_xgboost_and_lstm:/app/predict_xgboost_and_lstm:ro
        ports:
            - "8000:8000"
        depends_on:
            python_data:
                condition: service_healthy
            finsight_api:
                condition: service_started
        command: ["sh", "-c", "if [ ! -x node_modules/.bin/nest ]; then npm ci; fi; npm run start:dev"]
        env_file:
            - .env
        environment:
            # NestJS proxies the authenticated advisory endpoints.
            - PORT=8000
            - PYTHON_API_URL=http://python_data:6060/api
            - FINSIGHT_API_URL=http://finsight_api:6071
            # PostgreSQL is another Compose service, not the host machine.
            # - PGHOST=${PGHOST:-db}
            # - PGPORT=${PGPORT:-5432}
            - PGHOST=host.docker.internal
            - PGPORT=${VPS_DB_LOCAL_PORT:-5434}
            - LSTM_PRICE_RELEASE_POINTER_PATH=/app/deploy/price_forecast_lstm/daily_release.json
        extra_hosts:
            - "host.docker.internal:host-gateway"

    web:
        container_name: fireant_web
        image: node:22.9.0
        working_dir: /app/web
        volumes:
            - ./web:/app/web
            # Avoid loading Windows native modules (for example lightningcss)
            # inside the Linux Node container.
            - fireant_web_node_modules:/app/web/node_modules
        ports:
            - "3000:3000"
        command: ["sh", "-c", "if [ ! -x node_modules/.bin/next ]; then npm ci; fi; npm run dev"]
        depends_on:
            - api
        env_file:
            - .env
        environment:
            # Browser-visible settings for the local/demo compose deployment.
            - NEXT_PUBLIC_SHORT_TERM_ENABLED=true
            - NEXT_PUBLIC_LONG_TERM_ENABLED=true
            - NEXT_PUBLIC_V6_ENABLED=true
            # Used only by the Next.js server-side /api rewrite.
            - INTERNAL_API_BASE_URL=http://api:8000/api

    qdrant:
        image: qdrant/qdrant:v1.11.0
        ports:
            - "6333:6333"
        volumes:
            - qdrant_storage:/qdrant/storage

    ngrok:
        container_name: fireant_ngrok
        image: ngrok/ngrok:latest
        restart: unless-stopped
        command:
            - "start"
            - "--all"
            - "--config"
            - "/etc/ngrok.yml"
        volumes:
            - ./ngrok.yml:/etc/ngrok.yml
        ports:
            - "4040:4040"
        depends_on:
            - api

    python_data:
        container_name: fireant_python
        image: python:3.11-slim
        working_dir: /app/python
        volumes:
            - ./python_data:/app/python
            - ./data/:/app/python/data/
            # Read-only frozen/current short-term outputs. The scheduler is disabled
            # in this serving container; a separate pipeline worker refreshes it.
            - ./runs:/app/runs:ro
            # Frozen long-term advisory release and prediction artifact.
            - ./deploy:/app/deploy:ro
            - ./reports_wave_v6:/app/reports_wave_v6:ro
            - fireant_pip_cache:/usr/local/lib/python3.11/site-packages
        ports:
            - "6060:6060"
        dns:
            - 8.8.8.8
            - 1.1.1.1
        command: bash -c "apt-get update && apt-get install -y ca-certificates && pip install --no-cache-dir -r requirements.txt && python server.py"
        environment:
            - FLASK_APP=server.py
            - FLASK_ENV=development
            - TZ=Asia/Ho_Chi_Minh
            - WAVE_H120_RUN_ROOT=/app/runs/wave_h120_shadow
            - WAVE_H120_SHADOW_ENABLED=0
            - WAVE_V6_RELEASE_PATH=/app/deploy/wave_v6_advisory/serving_release.json
            - WAVE_V6_RUN_ROOT=/app/runs/wave_v6_daily
        healthcheck:
            test: ["CMD-SHELL", "python -c \"import urllib.request; [urllib.request.urlopen(url, timeout=5) for url in ('http://localhost:6060/api/wave-h120/latest?limit=1', 'http://localhost:6060/api/wave-v6/latest?limit=1')]\""]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 30s

    finsight_api:
        container_name: finsight_api
        build:
            context: .
            dockerfile: Dockerfile.finsight
        working_dir: /app
        restart: unless-stopped
        env_file:
            - .env
        environment:
            # The merged financial schema is in the Compose PostgreSQL service.
            # - FINANCIAL_DATABASE_URL=postgresql://countduck:countduck@db:5432/fireant_stock
            - FINANCIAL_DATABASE_URL=postgresql://countduck:countduck@host.docker.internal:${VPS_DB_LOCAL_PORT:-5434}/fireant_stock
            - QDRANT_URL=${QDRANT_URL}
            - QDRANT_API_KEY=${QDRANT_API_KEY}
        extra_hosts:
            - "host.docker.internal:host-gateway"
        ports:
            - "6071:6071"
        volumes:
            - finsight_hf_cache:/root/.cache/huggingface

    model_scoring:
        container_name: fireant_model_scoring
        build:
            context: .
            dockerfile: deploy/daily_scoring/Dockerfile
        working_dir: /app
        restart: unless-stopped
        env_file:
            - .env
        volumes:
            - ./data:/app/data
            - ./data_vnstock:/app/data_vnstock
            - ./runs:/app/runs
            - ./deploy:/app/deploy:ro
            - ./models:/app/models:ro
            - ./experiments:/app/experiments:ro
        environment:
            - TZ=Asia/Ho_Chi_Minh
            - WAVE_DAILY_SCORING_TIME=${WAVE_DAILY_SCORING_TIME:-19:00}
            - WAVE_DAILY_SCORING_RUN_ON_START=${WAVE_DAILY_SCORING_RUN_ON_START:-true}
            - WAVE_DAILY_SCORING_MAX_ATTEMPTS=${WAVE_DAILY_SCORING_MAX_ATTEMPTS:-8}
            - WAVE_DAILY_SCORING_RETRY_MINUTES=${WAVE_DAILY_SCORING_RETRY_MINUTES:-30}
            - WAVE_H120_REQUESTS_PER_MINUTE=${WAVE_H120_REQUESTS_PER_MINUTE:-25}
            - WAVE_HISTORY_SESSIONS=${WAVE_HISTORY_SESSIONS:-480}
            - WAVE_H120_UNIVERSE_SYMBOLS=/app/deploy/wave_h120_shadow/universe_symbols.csv
            - WAVE_H120_MAX_STALENESS_DAYS=${WAVE_H120_MAX_STALENESS_DAYS:-0}
            - WAVE_DAILY_KEEP_SUCCESS_RUNS=${WAVE_DAILY_KEEP_SUCCESS_RUNS:-14}
            - WAVE_DAILY_FAILED_RETENTION_DAYS=${WAVE_DAILY_FAILED_RETENTION_DAYS:-3}
        dns:
            - 8.8.8.8
            - 1.1.1.1

volumes:
    fireant_pip_cache:
    fireant_api_node_modules:
    fireant_web_node_modules:
    qdrant_storage:
    finsight_hf_cache:

    
